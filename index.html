<style>
  :root { --blue:#1e6bff; --teal:#22d3c5; --panel:rgba(10,18,44,.82); --line:rgba(255,255,255,.18); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#9ad0ff; font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif; color:#fff; user-select:none; }
  canvas#game { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .hide { display:none !important; }
  .panel { position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; backdrop-filter:blur(6px); box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .panel h2 { margin:0 0 10px; font-size:15px; letter-spacing:.5px; color:var(--teal); }
  #title { left:16px; top:12px; font-size:26px; font-weight:900; font-style:italic; text-shadow:0 2px 8px rgba(0,0,0,.5); }
  #title small { display:block; font-size:12px; font-weight:600; font-style:normal; opacity:.9; }

  #left { left:16px; top:70px; width:372px; max-height:calc(100% - 86px); overflow:auto; }
  #right { right:16px; top:16px; width:310px; max-height:calc(100% - 32px); overflow:auto; }
  .pal { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .pbtn { border-radius:11px; padding:4px 2px 3px; font-size:11px; letter-spacing:-0.4px; white-space:nowrap; display:flex; flex-direction:column; align-items:center; gap:0; margin-bottom:4px; }
  .pbtn svg { width:42px; height:32px; }
  .pbtn img.pico { width:auto; height:auto; max-width:88px; max-height:42px; object-fit:contain; margin:2px 0 1px; filter:drop-shadow(0 2px 2px rgba(0,0,0,.5)); pointer-events:none; user-select:none; }
  .seq { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; min-height:28px; }
  .chip { font-size:11px; padding:3px 7px; border-radius:20px; background:rgba(30,107,255,.45); border:1px solid rgba(255,255,255,.3); cursor:pointer; font-weight:700; }
  .chip:hover { background:#e5484d; }
  .row { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  /* ===== 게임풍 입체 버튼: 광택 그라데이션 + 굵은 테두리 + 아래 두께 + 눌림 ===== */
  .btn, .pbtn { --top:#8ba2d3; --m1:#5f77ae; --m2:#4a6199; --bot:#364b81; --bd:#142042; --sh:#0d1630; }
  .btn.red { --top:#ff7d6e; --m1:#e63b30; --m2:#c71f1f; --bot:#a01313; --bd:#4d0b0b; --sh:#5e0d0d; }
  .btn.green, .btn.go2 { --top:#90f07d; --m1:#47c840; --m2:#2fa82c; --bot:#208c24; --bd:#0d3d11; --sh:#0f4a15; }
  .btn.blue { --top:#80c3ff; --m1:#3b91f3; --m2:#2373dc; --bot:#1a5bb8; --bd:#0b2b66; --sh:#0b3072; }
  .btn.on, .pbtn.on { --top:#86f7ea; --m1:#27d0c1; --m2:#1ab4a7; --bot:#12998e; --bd:#064840; --sh:#075149; }
  .btn, .pbtn { position:relative; color:#fff; font:inherit; font-weight:900; text-shadow:0 1px 0 rgba(0,0,0,.6), 0 0 5px rgba(0,0,0,.25); cursor:pointer;
    background:linear-gradient(180deg, var(--top) 0%, var(--m1) 46%, var(--m2) 50%, var(--bot) 100%);
    border:2px solid var(--bd);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.5), inset 0 -3px 0 rgba(0,0,0,.18), 0 4px 0 var(--sh), 0 7px 10px rgba(0,0,0,.35);
    transition:transform .06s ease, filter .12s ease, box-shadow .06s ease; }
  .btn { font-size:12.5px; padding:7px 12px; border-radius:10px; margin-bottom:4px; }
  .btn:hover:not(:disabled), .pbtn:hover { filter:brightness(1.13) saturate(1.05); }
  .btn:active:not(:disabled), .pbtn:active { transform:translateY(3px); box-shadow:inset 0 2px 0 rgba(255,255,255,.4), inset 0 -2px 0 rgba(0,0,0,.18), 0 1px 0 var(--sh), 0 2px 4px rgba(0,0,0,.35); }
  .btn:disabled { --top:#a0a9bb; --m1:#808aa0; --m2:#6e788e; --bot:#5a647a; --bd:#2a3144; --sh:#1c2231; color:#e3e7f0; cursor:not-allowed; filter:none; }
  .btn.go2 { font-size:14px; padding:8px 16px; border-radius:11px; }
  .btn.big { font-size:16px; padding:11px 22px; border-radius:12px; }
  .btn.half { flex:1 1 0; min-width:0; text-align:center; padding-left:8px; padding-right:8px; white-space:nowrap; }
  button.go { width:100%; font-size:23px; padding:12px 14px; border-radius:14px; margin-top:6px; letter-spacing:1px; }
  .ico { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; margin-right:9px; vertical-align:middle; border-radius:50%; border:2.5px solid #fff; padding-left:2px; font-size:11px; letter-spacing:0;
    background:radial-gradient(circle at 50% 30%, rgba(255,255,255,.3), rgba(0,0,0,.35)); box-shadow:inset 0 0 5px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.45); }
  .plus { display:inline-block; margin-right:6px; font-size:1.25em; line-height:1; vertical-align:-1px; }
  #carSetup small { font-size:inherit; }
  .btn small { font-size:11px; opacity:.9; font-weight:700; margin-left:4px; }
  .status { margin-top:10px; font-size:13px; font-weight:700; line-height:1.5; padding:8px 10px; border-radius:10px; background:rgba(255,255,255,.07); }
  .ok { color:#6dffa8; } .bad { color:#ff8d8d; }
  .hint { font-size:11px; opacity:.75; line-height:1.5; font-weight:500; }
  .car { border:1px solid var(--line); border-radius:12px; padding:9px; margin-bottom:9px; background:rgba(255,255,255,.05); }
  .car .hd { display:flex; align-items:center; gap:8px; font-weight:800; font-size:14px; margin-bottom:6px; }
  .dot { width:16px; height:16px; border-radius:50%; border:2px solid #fff; }
  select { width:100%; font:inherit; font-size:12px; font-weight:700; padding:6px; margin:3px 0; border-radius:8px; border:1px solid var(--line); background:#14204a; color:#fff; }
  .car .st { font-size:11px; opacity:.85; margin-top:2px; line-height:1.5; font-weight:600; }
  .lapsel { display:flex; align-items:center; gap:8px; margin:6px 0 10px; font-size:13px; font-weight:700; }
  .lapsel select { width:auto; }

  .modeinfo { margin-top:0; font-size:12px; font-weight:700; color:#ffd36b; min-height:14px; }
  #toast { position:fixed; left:50%; bottom:40px; transform:translateX(-50%); background:rgba(190,40,50,.92); padding:10px 20px; border-radius:24px; font-weight:800; font-size:15px; z-index:6; box-shadow:0 6px 20px rgba(0,0,0,.4); }

  /* race */
  .hud { position:fixed; pointer-events:none; text-shadow:0 2px 6px rgba(0,0,0,.7); font-weight:800; }
  #stand { left:16px; top:16px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 14px; min-width:290px; pointer-events:auto; text-shadow:none; }
  #stand .r { display:flex; align-items:center; gap:8px; padding:5px 4px; border-bottom:1px solid var(--line); font-size:14px; cursor:pointer; }
  #stand .r.sel { background:rgba(34,211,197,.18); border-radius:8px; }
  #stand .r b { width:18px; } #stand .r span.t { margin-left:auto; font-size:12px; opacity:.9; font-variant-numeric:tabular-nums; }
  #stand .head { font-size:13px; color:var(--teal); margin-bottom:4px; }
  #center { left:0; right:0; top:24%; text-align:center; font-size:140px; font-style:italic; -webkit-text-stroke:3px #0a2a7a; }
  #msg { left:0; right:0; top:11%; text-align:center; font-size:26px; }
  #rbtns { right:16px; top:16px; display:flex; gap:10px; align-items:flex-start; pointer-events:auto; }
  .camwrap { position:relative; }
  #camMenu { position:absolute; top:calc(100% + 6px); right:0; z-index:3; display:flex; flex-direction:column; gap:8px; padding:10px; min-width:150px; background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:0 10px 24px rgba(0,0,0,.4); }
  #camMenu .btn { margin:0; text-align:left; white-space:nowrap; }
  #help { left:16px; bottom:14px; font-size:13px; opacity:.9; line-height:1.7; }
  kbd { background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.4); border-radius:6px; padding:1px 7px; font-family:inherit; font-weight:700; }
  #spd { right:20px; bottom:16px; text-align:right; font-size:54px; line-height:1; }
  #spd small { font-size:16px; opacity:.85; } #spd div.nm { font-size:14px; opacity:.9; margin-bottom:4px; }

  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 50% 40%, rgba(20,60,160,.55), rgba(5,10,30,.88)); z-index:5; }
  .card { text-align:center; padding:28px 40px; border-radius:22px; background:rgba(10,18,44,.85); border:2px solid rgba(34,211,197,.55); max-width:600px; }
  .card h1 { margin:0 0 10px; font-size:44px; font-style:italic; background:linear-gradient(90deg,#4da0ff,#22d3c5); -webkit-background-clip:text; background-clip:text; color:transparent; }
  table { margin:10px auto 18px; border-collapse:collapse; font-size:17px; min-width:420px; }
  td,th { padding:6px 12px; border-bottom:1px solid var(--line); text-align:left; }
  #modal { z-index:8; }
  #modal .card { text-align:left; width:min(560px,94vw); max-height:86vh; overflow:auto; padding:20px 26px; position:relative; }
  #modal h1 { font-size:26px; margin:0 0 10px; }
  #modalClose { position:absolute; right:14px; top:12px; }
  #modal input { font:inherit; font-size:13px; font-weight:700; padding:7px 9px; border-radius:8px; border:1px solid var(--line); background:#14204a; color:#fff; user-select:text; }
  table.rk { min-width:0; width:100%; font-size:14px; margin:6px 0 4px; }
  table.rk td, table.rk th { padding:5px 8px; } table.rk tr.me { background:rgba(34,211,197,.2); }
  .crow { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 4px; border-bottom:1px solid var(--line); font-size:14px; }
  .clist { margin-top:8px; max-height:46vh; overflow:auto; }
  /* 로고: 만화체 굵은 글씨 + 노란 그라데이션 + 두꺼운 남색 외곽선 + 아래 그림자 */
  #home { flex-direction:column; gap:10px; }
  .homeLogo { margin:0; pointer-events:none; }
  .homeLogo .stk.big { font-size:88px; } .homeLogo .stk.small { font-size:54px; }
  .homeLogo .stk.big::before { -webkit-text-stroke:8px #000; } .homeLogo .stk.small::before { -webkit-text-stroke:6px #000; }
  .logo { text-align:center; margin:2px 0 10px; font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif; font-weight:800; }
  .stk { position:relative; display:block; line-height:1.2; letter-spacing:0; }
  .stk::before { content:attr(data-t); position:absolute; left:0; right:0; top:0; z-index:0; color:#000; -webkit-text-stroke:4px #000; text-shadow:0 2px 0 #000, 0 5px 7px rgba(0,0,0,.45); }
  .stk > span { position:relative; z-index:1; -webkit-background-clip:text; background-clip:text; color:transparent; }
  .stk.big { font-size:44px; } .stk.big > span { background-image:linear-gradient(180deg,#fffbd0 0%,#ffe24a 42%,#ffa621 100%); }
  .stk.small { font-size:27px; margin-top:-2px; font-weight:700; } .stk.small > span { background-image:linear-gradient(180deg,#ffffff 0%,#cfeaff 45%,#6cc2ff 100%); }
  .stk.small::before { -webkit-text-stroke:3px #000; }
  .sub { display:inline-block; background:#0b1a4a; border:2px solid #4a76e8; border-radius:20px; padding:4px 16px; color:#ffe27a; font-weight:800; font-size:12.5px; box-shadow:0 3px 0 #060f30; }
  /* 가운데 레이어 팝업 (코스 상태 문구) */
  #statusPop { position:fixed; left:50%; top:40%; z-index:7; transform:translate(-50%,-50%); min-width:320px; max-width:min(520px,90vw); padding:20px 34px 18px; text-align:center; pointer-events:none;
    background:rgba(10,18,44,.95); border:3px solid #3ddc84; border-radius:20px; box-shadow:0 14px 40px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.12); }
  #statusPop.bad { border-color:#ff7b7b; }
  #statusPop.show { animation:popIn .22s ease-out; }
  #statusPop .pt { font-size:24px; font-weight:900; color:#6dffa8; text-shadow:0 2px 0 rgba(0,0,0,.5); }
  #statusPop.bad .pt { color:#ff9a9a; }
  #statusPop .ps { margin-top:6px; font-size:13.5px; font-weight:600; color:#cfd9f3; line-height:1.5; }
  @keyframes popIn { from { opacity:0; transform:translate(-50%,-46%) scale(.92); } to { opacity:1; transform:translate(-50%,-50%) scale(1); } }
  /* 추천 코스: 어두운 보라 입체 버튼, 3칸으로 가로를 꽉 채움 */
  .presets { display:grid; grid-template-columns:repeat(3,1fr); gap:9px 6px; margin:8px 0 6px; }
  .btn.preset { --top:#8068b8; --m1:#5f4a9e; --m2:#4f3b8c; --bot:#3d2e72; --bd:#1a1040; --sh:#140c33; color:#fff; text-shadow:0 1px 0 rgba(0,0,0,.6);
    margin:0; width:100%; padding:10px 2px; border-radius:9px; font-size:12.5px; white-space:nowrap; }
  /* 편집 도구: 5칸 × 2줄, 빈 칸 없이 폭을 꽉 채움 */
  .tools { display:grid; grid-template-columns:repeat(5,1fr); gap:9px 6px; margin:8px 0 6px; }
  .tools .btn { margin:0; width:100%; padding:8px 2px; display:flex; align-items:center; justify-content:center; gap:3px; white-space:nowrap; font-size:12.5px; }
  .ti { flex:none; width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(0 1px 0 rgba(0,0,0,.5)); }
  /* 방 대기화면: 참여 인원 박스 */
  #plist { background:#fff; color:#1c2542; border:3px solid #cfd9f3; border-radius:14px; padding:6px 10px 8px; margin:6px 0 12px; box-shadow:inset 0 2px 6px rgba(20,40,90,.10), 0 3px 0 rgba(0,0,0,.25); }
  .pl-head { display:flex; justify-content:space-between; align-items:center; padding:2px 2px 7px; margin-bottom:3px; border-bottom:2px solid #e3e8f4; font-weight:900; font-size:13px; color:#2a3a6e; }
  .pl-head .cnt { background:#2a3a6e; color:#fff; border-radius:10px; padding:1px 10px; font-size:12px; }
  .pl-row { display:flex; align-items:center; gap:10px; padding:7px 6px; border-radius:9px; }
  .pl-row + .pl-row { margin-top:2px; }
  .pl-row.me { background:#eaf3ff; }
  .pl-no { flex:none; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:900; font-size:13px; border:2px solid #0b2b66; text-shadow:0 1px 0 rgba(0,0,0,.5); background:linear-gradient(180deg,#80c3ff,#2373dc); }
  .pl-name { font-weight:900; font-size:15px; line-height:1.2; color:#1c2542; }
  .pl-me { display:inline-block; margin-left:6px; padding:0 7px; border-radius:8px; background:#2fa82c; color:#fff; font-size:10.5px; vertical-align:1px; }
  .pl-sub { margin-top:1px; font-size:11px; font-weight:700; color:#66728f; }
  .pl-empty { margin:4px 0; padding:8px; border:2px dashed #d3dbec; border-radius:10px; text-align:center; font-size:13px; font-weight:700; color:#a2acc4; }
  /* 방 제목 입력 */
  #modal .rtinput { width:100%; border:3px solid #0d1a4a; border-radius:12px; outline:0; font:inherit; font-weight:900; font-size:18px; color:#1c2542; padding:11px 14px; user-select:text;
    background:linear-gradient(180deg,#dfe7f6,#f8faff); box-shadow:inset 0 4px 8px rgba(20,40,90,.30), 0 4px 0 #08122f; }
  #modal .rtinput::placeholder { color:#8a95b0; font-weight:700; }
  #modal .rtinput:focus { background:#fff; box-shadow:inset 0 4px 8px rgba(20,40,90,.30), inset 0 0 0 3px #ffd23a, 0 4px 0 #08122f; }
  /* 닉네임 입력: 파란 태그 + 안쪽으로 파인 입력칸 */
  .nickbox { display:flex; justify-content:center; margin:14px 0 14px; }
  .nickbox .wrap { display:inline-flex; align-items:stretch; border:3px solid #0d1a4a; border-radius:14px; overflow:hidden; box-shadow:0 4px 0 #08122f, 0 8px 10px rgba(0,0,0,.35); }
  .nickbox .tag { display:flex; align-items:center; padding:0 14px; color:#fff; font-weight:900; font-size:13px; text-shadow:0 1px 0 rgba(0,0,0,.6); border-right:3px solid #0d1a4a;
    background:linear-gradient(180deg,#80c3ff 0%,#3b91f3 46%,#2373dc 50%,#1a5bb8 100%); box-shadow:inset 0 2px 0 rgba(255,255,255,.5); }
  .nickbox input { width:180px; border:0; outline:0; text-align:center; font:inherit; font-weight:900; font-size:17px; color:#1c2542; padding:9px 10px; user-select:text;
    background:linear-gradient(180deg,#dfe7f6,#f8faff); box-shadow:inset 0 4px 8px rgba(20,40,90,.30); }
  .nickbox input:focus { background:#fff; box-shadow:inset 0 4px 8px rgba(20,40,90,.30), inset 0 0 0 3px #ffd23a; }
  /* 방 목록: 흰색 박스 */
  #roomList { background:#fff; color:#1c2542; border:3px solid #cfd9f3; border-radius:14px; padding:4px 14px; box-shadow:inset 0 2px 6px rgba(20,40,90,.10), 0 3px 0 rgba(0,0,0,.25); }
  #roomList .crow { border-bottom:1px solid #e3e8f4; }
  #roomList .crow:last-child { border-bottom:0; }
  #roomList b { color:#1c2542; font-size:23px; line-height:1.15; letter-spacing:-0.5px; }
  #roomList .crow > div:first-child { line-height:1.3; }
  #right h2 { font-size:25px; line-height:1.15; }
  #roomList .hint { color:#66728f; opacity:1; }
  #roomList .hint.empty { font-size:15px; }
  .row.top { margin:0 0 8px; align-items:center; }
  #nick { width:120px; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#06102a; font-size:22px; z-index:9; }

  /* ================= 모바일 (폭 820px 이하 / 가로 모드 폰) ================= */
  #mobBottom, #mobPlist, #mobLeave, .sheet-x { display:none; }
  .lv-m { display:none; }
  @media (max-width:820px), (max-height:560px) {
    html, body { overscroll-behavior:none; }
    canvas#game { touch-action:none; }
    button, .btn, select, label { touch-action:manipulation; }
    select, input { font-size:16px !important; }            /* iOS 에서 입력칸을 누를 때 화면이 확대되는 것 방지 */
    #title { display:none !important; }

    /* 홈 */
    #home { gap:6px; }
    .homeLogo .stk.big { font-size:60px; } .homeLogo .stk.small { font-size:36px; }
    #home .card { width:94vw !important; max-width:94vw; padding:14px 12px !important; border-radius:18px; max-height:calc(100dvh - 150px); overflow:auto; }
    .logo { margin:0 0 4px; } .stk.big { font-size:32px; } .stk.small { font-size:19px; } .sub { font-size:11px; padding:3px 12px; }
    .nickbox { margin:10px 0; } .nickbox input { width:120px; padding:7px 8px; } .nickbox .tag { padding:0 10px; font-size:12px; }
    #home h2 { font-size:14px !important; }
    #roomList { max-height:32dvh; padding:2px 10px; }
    #roomList b { font-size:17px; } #roomList .crow { padding:7px 2px; gap:6px; } #roomList .hint { font-size:10.5px; }
    #roomList .crow .btn { white-space:nowrap; font-size:11.5px; padding:6px 8px; margin:0; }
    #roomList .crow > .row { flex-shrink:0; gap:5px; }
    #home .btn.big, #home .btn.big small { font-size:15px; }
    #home .btn.big { padding:10px 6px; }
    #carSetup small { display:block; margin:0; }

    /* 방 화면: 좌/우 패널 = 아래 시트 + 탭으로 전환 */
    /* 하단 고정 영역: 탭(코스 편집 / 방 정보) 아래에 시작 버튼. 시트는 이 영역의 실제 높이(--mbh) 위에 놓인다 */
    #mobBottom { display:flex; flex-direction:column; gap:6px; position:fixed; left:8px; right:8px; bottom:calc(8px + env(safe-area-inset-bottom)); z-index:4; }
    #mtabs { display:flex; gap:8px; }
    #mobStart #startBox { display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; padding:0; margin:0; }
    #mobStart #startBtn { flex:1; width:auto; margin:0; padding:8px 10px; font-size:19px; letter-spacing:0; }
    #mobStart .ico { width:22px; height:22px; margin-right:6px; font-size:9px; border-width:2px; }
    #mobStart #startChoice { flex-basis:100%; background:rgba(10,18,44,.92); border:1px solid var(--line); border-radius:12px; padding:8px 10px; }
    #mobStart #startChoice .row { gap:6px; flex-wrap:nowrap; } #mobStart #startChoice .hint { margin:0 0 6px; font-size:11px; }
    /* 참여 인원: 오른쪽 위에 작게 고정 */
    #mobPlist { display:block; position:fixed; top:calc(8px + env(safe-area-inset-top)); right:8px; width:172px; z-index:3; pointer-events:none; }
    #mobPlist #plist { margin:0; padding:4px 6px 5px; border-width:2px; border-radius:10px; font-size:12px; box-shadow:0 2px 0 rgba(0,0,0,.25); }
    #mobPlist .pl-head { padding:0 1px 3px; margin-bottom:1px; border-bottom-width:1px; font-size:12px; } #mobPlist .pl-head .cnt { padding:0 7px; font-size:12px; }
    #mobPlist .pl-row { padding:3px 2px; gap:6px; border-radius:6px; } #mobPlist .pl-row + .pl-row { margin-top:0; }
    #mobPlist .pl-no { width:18px; height:18px; font-size:11px; border-width:1.5px; }
    #mobPlist .pl-name { font-size:12px; line-height:1.2; } #mobPlist .pl-me { margin-left:4px; padding:0 5px; font-size:10px; }
    #mobPlist .pl-sub { font-size:12px; margin-top:0; line-height:1.2; }
    #mobPlist .pl-empty { margin:3px 0; padding:3px; border-width:1px; font-size:12px; }
    #mtabs .mtab { flex:1; margin:0; padding:10px 6px; font-size:13px; border-radius:12px; position:relative; }
    .mtab .dot { display:none; position:absolute; right:9px; top:7px; width:9px; height:9px; border-radius:50%; background:#6dffa8; box-shadow:0 0 0 2px rgba(0,0,0,.4); }
    .mtab.ready .dot { display:block; }
    #editor.noleft #mtabs { display:none; }
    #left, #right { position:fixed; left:8px; right:8px; top:auto; width:auto; max-height:42dvh; bottom:calc(var(--mbh, 64px) + 16px + env(safe-area-inset-bottom)); padding:10px 12px; border-radius:16px; }
    #editor.noleft #right { max-height:46dvh; }
    #editor[data-tab="left"] #right, #editor[data-tab="right"] #left, #editor[data-tab="none"] #left, #editor[data-tab="none"] #right { display:none; }
    /* 시트 닫기(✕): 방장만. 스크롤해도 시트 오른쪽 위에 붙어 있다 */
    #editor:not(.noleft) .sheet-x { display:flex; position:sticky; top:0; float:right; z-index:3; width:30px; height:30px; padding:0; margin:-2px -2px 4px 8px; align-items:center; justify-content:center; font-size:14px; border-radius:9px; }
    #left > h2:first-of-type, #right > h2:first-of-type { min-height:36px; padding-top:8px; box-sizing:border-box; margin-bottom:2px; }
    #left .pal { clear:both; }
    /* 방 나가기: 왼쪽 위 */
    #mobLeave { display:block; position:fixed; left:8px; top:calc(8px + env(safe-area-inset-top)); z-index:4; }
    #mobLeave .btn { margin:0; padding:7px 12px; font-size:12px; }
    .lv-d { display:none; } .lv-m { display:inline; }
    /* 코스 부품: 한 줄에 6개 */
    .pal { grid-template-columns:repeat(6,1fr); gap:5px; }
    .pbtn { padding:5px 0 3px; font-size:9.5px; letter-spacing:-0.4px; border-radius:9px; }
    .pbtn svg { width:100%; max-width:36px; height:26px; }
    #left h2, #right h2 { margin-bottom:6px; }
    #right h2 { font-size:19px; }
    .tools { gap:7px 5px; } .tools .btn { font-size:11px; padding:7px 0; gap:2px; } .ti { width:12px; height:12px; }
    .presets { gap:7px 5px; } .btn.preset { font-size:11.5px; padding:9px 0; }
    .modeinfo { font-size:11px; margin-top:0; min-height:12px; }
    #left .toolsTitle { margin-top:0 !important; }
    #plist { margin:4px 0 8px; } .pl-row { padding:5px 4px; } .pl-name { font-size:14px; }
    .car { padding:7px; } button.go { font-size:19px; padding:10px; }
    #statusPop { min-width:220px; top:28%; padding:14px 18px 12px; } #statusPop .pt { font-size:19px; } #statusPop .ps { font-size:12px; }
    #toast { bottom:calc(150px + env(safe-area-inset-bottom)); font-size:13px; max-width:90vw; text-align:center; }

    /* 레이스 화면 */
    #stand { left:8px; top:calc(8px + env(safe-area-inset-top)); min-width:0; width:min(230px,58vw); padding:6px 8px; border-radius:12px; }
    #stand .r { font-size:12px; padding:3px 2px; gap:6px; } #stand .r span.t { font-size:10.5px; } #stand .head { font-size:11.5px; margin-bottom:2px; }
    #rbtns { right:8px; top:calc(8px + env(safe-area-inset-top)); gap:6px; flex-direction:column; align-items:flex-end; }
    #rbtns .btn { font-size:11.5px; padding:6px 10px; margin:0; }
    #camMenu { right:0; min-width:140px; padding:8px; }
    #help { display:none; }
    #spd { right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); font-size:34px; } #spd small { font-size:12px; } #spd div.nm { font-size:11px; margin-bottom:2px; }
    #center { font-size:88px; top:20%; -webkit-text-stroke:2px #0a2a7a; }
    #msg { font-size:16px; top:18%; padding:0 12px; }

    /* 결과 / 팝업 */
    .card { padding:16px 14px; max-width:94vw; border-radius:18px; } .card h1 { font-size:28px; }
    table { min-width:0; width:100%; font-size:12.5px; margin:8px auto 12px; } td, th { padding:5px 5px; }
    #result .card .btn { font-size:13px !important; padding:9px 12px !important; }
    #modal .card { padding:14px 14px; max-height:90dvh; width:94vw; } #modal h1 { font-size:22px; }
    #modalClose { right:10px; top:10px; }
  }
  @media (max-width:380px) { .stk.big { font-size:28px; } .tools .btn { font-size:10.5px; } #stand { width:min(200px,56vw); } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="loading">3D 모델 불러오는 중…</div>

<div id="toast" class="hide"></div>
<div id="statusPop" class="hide"></div>

<!-- ================= 홈 (방 목록) ================= -->
<div class="overlay hide" id="home" style="background:linear-gradient(180deg, rgba(10,20,60,.04), rgba(10,20,60,.16))">
    <div class="logo homeLogo"><div class="stk big" data-t="우리도챔피언"><span>우리도챔피언</span></div><div class="stk small" data-t="실시간 레이스"><span>실시간 레이스</span></div></div>
  <div class="card" style="text-align:left;width:min(660px,94vw);padding:24px 30px">
    <div style="text-align:center"><span class="sub">코스를 만들고, 친구와 함께 달려 보세요</span></div>
    <div class="nickbox"><div class="wrap"><span class="tag">닉네임</span><input id="nick" maxlength="12"></div></div>
    <h2 style="margin:6px 0 6px;font-size:15px;color:var(--teal);text-align:left">참여할 수 있는 방</h2>
    <div id="roomList" class="clist"></div>
    <div class="row" style="margin-top:14px;flex-wrap:nowrap;gap:10px">
      <button class="btn green big half" id="makeRoom"><span class="plus"></span>방 만들기</button>
      <button class="btn big half" id="carSetup" disabled>🔧 미니카 커스텀<small>(서비스 준비중)</small></button>
    </div>
  </div>
</div>

<!-- ================= 방 화면 (방장: 트랙 커스텀 / 참여자: 보기 전용) ================= -->
<div id="editor" class="hide">
  <div class="hud" id="title">MINI 4WD CIRCUIT BUILDER</div>
  <div id="mobPlist"></div>
  <div id="mobLeave"></div>
  <div id="mobBottom"><div id="mtabs"><button class="btn mtab on" id="mtLeft">🧩 코스 편집</button><button class="btn mtab" id="mtRight">⚙️ 설정<i class="dot"></i></button></div><div id="mobStart"></div></div>

  <div class="panel" id="left">
    <button class="btn sheet-x" id="xLeft" aria-label="닫기">✕</button>
    <h2>코스 부품 (클릭 → 마우스로 배치)</h2>
    <div class="pal" id="pal"></div>
    <div class="modeinfo" id="modeInfo"></div>
    <h2 class="toolsTitle" style="margin-top:0">편집 도구</h2>
    <div class="tools">
      <button class="btn" id="tSelect" title="선택 / 이동 (Q)"><svg class="ti" viewBox="0 0 16 16"><path d="M3 2l9.5 5.2-4.2 1.2L6.6 13z" fill="currentColor"/></svg>선택</button>
      <button class="btn" id="tDelete" title="지우개 - 클릭한 부품 삭제 (W)"><svg class="ti" viewBox="0 0 16 16"><path d="M3 11l6-7 4 3.5-4 5H5.5z"/><path d="M8 14h6"/></svg>지우개</button>
      <button class="btn" id="bFlip" title="좌우반전 (F)"><svg class="ti" viewBox="0 0 16 16"><path d="M2 5h11M10 2l3 3-3 3M14 11H3M6 8l-3 3 3 3"/></svg>반전</button>
      <button class="btn" id="bRotL" title="왼쪽으로 45° 회전 (Z)"><svg class="ti" viewBox="0 0 16 16"><path d="M3 8a5 5 0 1 0 1.8-3.8"/><path d="M3 2.5v3h3"/></svg>좌회전</button>
      <button class="btn" id="bRotR" title="오른쪽으로 45° 회전 (X)"><svg class="ti" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.8-3.8"/><path d="M13 2.5v3h-3"/></svg>우회전</button>
      <button class="btn" id="bDel" title="선택한 부품 삭제 (Del)"><svg class="ti" viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 8.5h5.6l.7-8.5"/></svg>삭제</button>
      <button class="btn" id="undo" title="되돌리기 (Ctrl+Z)"><svg class="ti" viewBox="0 0 16 16"><path d="M5 3L2 6l3 3"/><path d="M2 6h7a4 4 0 0 1 0 8H6"/></svg>취소</button>
      <button class="btn" id="redo" title="다시 (Ctrl+Y)"><svg class="ti" viewBox="0 0 16 16"><path d="M11 3l3 3-3 3"/><path d="M14 6H7a4 4 0 0 0 0 8h3"/></svg>다시</button>
      <button class="btn" id="clear" title="전체 지우기"><svg class="ti" viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="2"/><path d="M5.7 5.7l4.6 4.6M10.3 5.7l-4.6 4.6"/></svg>비우기</button>
      <button class="btn" id="fit" title="화면 맞춤 (A)"><svg class="ti" viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>맞춤</button>
    </div>
    <h2 style="margin-top:14px">추천 코스</h2>
    <div class="presets" id="presets"></div>
  </div>

  <div class="panel" id="right">
    <button class="btn sheet-x" id="xRight" aria-label="닫기">✕</button>
    <div class="row" id="leaveRow" style="justify-content:flex-end;margin:-4px -2px 2px"><button class="btn" id="leaveBtn" style="margin:0"><span class="lv-d">← 방 나가기</span><span class="lv-m">나가기</span></button></div>
    <h2 style="margin-top:0"><span id="rTitle">방</span></h2>
    <div class="hint" id="rInfo" style="margin:0 0 6px"></div>
    <div id="plist"></div>
    <div class="car" id="myCar"></div>
    <div id="startBox">
      <button class="btn red go" id="startBtn"><span class="ico">▶</span>시작</button>
      <div id="startChoice" class="hide">
        <div class="hint" style="margin:6px 0">아직 참여자가 없어요. 어떻게 시작할까요?</div>
        <div class="row" style="margin:0"><button class="btn go2" id="soloBtn">🚗 혼자하기</button><button class="btn go2 blue" id="aiBtn">🤖 AI와 하기</button><button class="btn" id="choiceCancel">취소</button></div>
      </div>
    </div>
    <div class="hint hide" id="waitMsg" style="font-size:13px;margin-top:10px"></div>
    <div class="hint" id="startErr" style="color:#ff8d8d"></div>
  </div>
</div>

<!-- ================= 레이스 화면 ================= -->
<div id="race" class="hide">
  <div id="stand" class="hud"></div>
  <div class="hud" id="rbtns"><div class="camwrap"><button class="btn blue" id="camToggle">📷 카메라 변경</button><div id="camMenu" class="hide"><button class="btn camb on" data-m="0">🎥 추적</button><button class="btn camb" data-m="1">🛩 항공 추적</button><button class="btn camb" data-m="2">🗺 항공 전체</button><button class="btn camb" data-m="3">🖱 자유</button><button class="btn" id="camReset" title="0">⟲ 시점 초기화</button></div></div><button class="btn red" id="toEditor">경기종료</button></div>
  <div class="hud" id="center"></div>
  <div class="hud" id="msg"></div>
  <div class="hud" id="spd"><div class="nm" id="spdName"></div><span id="spdV">0</span><small> km/h</small></div>
  <div class="hud" id="help"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 따라갈 차 선택 (1=나) &nbsp; <kbd>C</kbd> 카메라 전환 <kbd>V</kbd> 항공뷰 &nbsp; <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd>/드래그 시점 회전 &nbsp; 휠·<kbd>+</kbd><kbd>-</kbd> 확대 &nbsp; <kbd>0</kbd> 시점 초기화 &nbsp; <kbd>E</kbd> 경기종료 &nbsp; <kbd>M</kbd> 소리</div>
</div>

<div class="overlay hide" id="result">
  <div class="card">
    <h1 id="resTitle">RESULT</h1>
    <table id="resTable"></table>
    <div id="resRank" style="margin:-6px 0 12px;font-size:15px;font-weight:700;color:#ffd36b;min-height:20px"></div>
    <div class="row" style="justify-content:center">
      <button class="btn blue" id="resRankBtn" style="font-size:16px;padding:10px 22px">🏆 랭킹 보기</button>
      <button class="btn red" id="editBtn" style="font-size:16px;padding:10px 22px">경기종료</button>
    </div>
  </div>
</div>

<div class="overlay hide" id="modal">
  <div class="card">
    <button class="btn" id="modalClose">✕ 닫기</button>
    <h1 id="modalTitle"></h1>
    <div id="modalBody"></div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
